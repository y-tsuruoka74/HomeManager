version: "3"

vars:
  PROFILE: work
  # git-user 関数（dotfiles/zsh/extra.zsh）を読み込んで実行するためのシェル
  GIT_USER_SH: zsh -c 'source dotfiles/zsh/extra.zsh 2>/dev/null; git-user "$@"' git-user

tasks:
  fmt:
    desc: Nix ファイルを整形する
    cmds:
      - nixfmt flake.nix machine.nix home.nix hosts/*.nix modules/*.nix modules/ai/*.nix modules/darwin/*.nix

  lint:
    desc: Nix の整形・静的解析と zsh の構文を確認する
    cmds:
      - nixfmt --check flake.nix machine.nix home.nix hosts/*.nix modules/*.nix modules/ai/*.nix modules/darwin/*.nix
      - statix check .
      - deadnix --fail --no-lambda-pattern-names .
      - zsh -n dotfiles/zsh/extra.zsh
      - zsh -n dotfiles/zsh/prompt.zsh

  test:
    desc: 設定マージと監視判定の回帰テスト（jq と python3 が必要）
    cmds:
      - python3 -B -m unittest discover -s tests -v

  build:home:
    desc: 単体 Home Manager 構成をビルドする（適用しない）
    cmds:
      - nix build --no-link '.#homeConfigurations.{{.PROFILE}}.activationPackage'

  build:darwin:
    desc: Darwin 構成をビルドする（適用しない）
    cmds:
      - nix build --no-link '.#darwinConfigurations.{{.PROFILE}}.system'

  git:identities:
    desc: git プロファイル（user.name/email/signingkey）の一覧と現在のデフォルトを表示する
    cmds:
      - '{{.GIT_USER_SH}} list'

  git:whoami:
    desc: カレントディレクトリで有効な git ユーザー・署名設定を表示する
    cmds:
      - git config --show-origin --get-regexp '^(user\.(name|email|signingkey)|gpg\.|commit\.gpgsign|tag\.gpgsign)'

  git:identity:add:
    desc: "git プロファイルを作成・更新する（例: task git:identity:add -- personal --name N --email E --signingkey K）"
    interactive: true
    cmds:
      - '{{.GIT_USER_SH}} add {{.CLI_ARGS}}'

  git:identity:use:
    desc: "デフォルトの git プロファイルを切り替える（例: task git:identity:use -- work）"
    cmds:
      - '{{.GIT_USER_SH}} {{.CLI_ARGS}}'

  git:sign:check:
    desc: 署名設定を検査し、一時リポジトリで署名付きコミットを作って確認する（1Password の承認が出る）
    interactive: true
    cmds:
      - |
        set -e
        [ "$(git config gpg.format)" = ssh ] || { echo "NG: gpg.format が ssh ではありません"; exit 1; }
        [ "$(git config commit.gpgsign)" = true ] || { echo "NG: commit.gpgsign が true ではありません"; exit 1; }
        key="$(git config user.signingkey)" || { echo "NG: user.signingkey が未設定です（task git:identities で確認）"; exit 1; }
        prog="$(git config gpg.ssh.program)"
        [ -x "$prog" ] || { echo "NG: gpg.ssh.program が実行できません: $prog"; exit 1; }
        echo "設定 OK: $(git config user.name) <$(git config user.email)>"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        git -C "$tmp" init -q
        git -C "$tmp" -c user.name="$(git config user.name)" -c user.email="$(git config user.email)" \
          commit -q --allow-empty -m "signing test"
        if git -C "$tmp" cat-file commit HEAD | grep -q '^gpgsig '; then
          echo "OK: 署名付きコミットを作成できました"
        else
          echo "NG: コミットに署名が付いていません"; exit 1
        fi

  default:
    desc: 利用可能なタスク一覧を表示する
    cmds:
      - task --list
    silent: true

  check:
    desc: 静的解析・回帰テスト・両構成のビルド（適用しない）
    cmds:
      - task: lint
      - task: test
      - nix flake check
      - task: build:home
      - task: build:darwin
      - nix build --no-link '.#darwinConfigurations.work.system' '.#darwinConfigurations.personal.system'
      - nix build --no-link '.#homeConfigurations.work.activationPackage' '.#homeConfigurations.personal.activationPackage'

  home:
    desc: home.nix配下（packages.nix, ai/ 等）のみをsudoなしで適用する
    cmds:
      - home-manager switch --flake '.#{{.PROFILE}}' -b backup

  darwin:
    desc: システム全体（Homebrew, launchd watchdog等）を適用する。sudoが必要
    cmds:
      - sudo darwin-rebuild switch --flake '.#{{.PROFILE}}'

  nh:build:
    desc: nh で Darwin 構成をビルドし現行世代との差分を表示する（適用しない）
    cmds:
      - nh darwin build . -H '{{.PROFILE}}'

  nh:darwin:
    desc: nh で Darwin 構成を差分確認のうえ適用する（nh が必要時に sudo を呼ぶ）
    interactive: true
    cmds:
      - nh darwin switch . -H '{{.PROFILE}}' --ask

  nh:home:
    desc: nh で単体 Home Manager 構成を差分確認のうえ適用する
    interactive: true
    cmds:
      - nh home switch . -c '{{.PROFILE}}' --ask -b backup

  nh:clean:
    desc: nh で古い世代を整理する（直近5世代か7日以内は残す）
    interactive: true
    cmds:
      - nh clean all --keep 5 --keep-since 7d --ask

  update:
    desc: flake.lock の入力を更新する
    cmds:
      - nix flake update
